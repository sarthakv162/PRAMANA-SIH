openapi: 3.1.0
info:
  title: PRAMANA
  description: Proof-carrying, multilingual assistant for Ayurvedic IP, ABS and drug-regulatory
    questions. Informational, not legal advice.
  version: 0.1.0
paths:
  /v1/health:
    get:
      tags:
      - health
      summary: Health
      operationId: health_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /v1/query:
    post:
      tags:
      - query
      summary: Query
      operationId: query_v1_query_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
        required: true
      responses:
        '200':
          description: 'Server-sent events: stage, result or error, then done.'
          content:
            text/event-stream:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/classify:
    post:
      tags:
      - classify
      summary: Classify
      operationId: classify_v1_classify_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ClassifyQuestion'
                - $ref: '#/components/schemas/ClassifyResult'
                title: Response Classify V1 Classify Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/patent-risk:
    post:
      tags:
      - patent-risk
      summary: Patent Risk
      operationId: patent_risk_v1_patent_risk_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatentRiskRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatentRisk'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/abs-check:
    post:
      tags:
      - abs
      summary: Abs Check
      operationId: abs_check_v1_abs_check_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/tk-radar:
    post:
      tags:
      - tk
      summary: Tk Radar
      operationId: tk_radar_v1_tk_radar_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Formulation'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TkRadar'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/dossier:
    post:
      tags:
      - dossier
      summary: Build Dossier
      operationId: build_dossier_v1_dossier_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DossierRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/documents:
    get:
      tags:
      - documents
      summary: List Documents
      operationId: list_documents_v1_documents_get
      parameters:
      - name: jurisdiction
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Jurisdiction'
          - type: 'null'
          title: Jurisdiction
      - name: doc_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Doc Type
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocumentSummary'
                title: Response List Documents V1 Documents Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/documents/{doc_id}/pdf:
    get:
      tags:
      - documents
      summary: Get Document Pdf
      operationId: get_document_pdf_v1_documents__doc_id__pdf_get
      parameters:
      - name: doc_id
        in: path
        required: true
        schema:
          type: string
          title: Doc Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/spans/{evidence_id}:
    get:
      tags:
      - documents
      summary: Get Span
      operationId: get_span_v1_spans__evidence_id__get
      parameters:
      - name: evidence_id
        in: path
        required: true
        schema:
          type: string
          title: Evidence Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceSpan'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/corpus/versions:
    get:
      tags:
      - corpus
      summary: List Corpus Versions
      operationId: list_corpus_versions_v1_corpus_versions_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CorpusVersionInfo'
                type: array
                title: Response List Corpus Versions V1 Corpus Versions Get
  /v1/receipts/{receipt_id}:
    get:
      tags:
      - receipts
      summary: Get Receipt
      operationId: get_receipt_v1_receipts__receipt_id__get
      parameters:
      - name: receipt_id
        in: path
        required: true
        schema:
          type: string
          title: Receipt Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/receipts/{receipt_id}/verify:
    post:
      tags:
      - receipts
      summary: Verify Receipt
      operationId: verify_receipt_v1_receipts__receipt_id__verify_post
      parameters:
      - name: receipt_id
        in: path
        required: true
        schema:
          type: string
          title: Receipt Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/speech/asr:
    post:
      tags:
      - speech
      summary: Speech Asr
      operationId: speech_asr_v1_speech_asr_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_speech_asr_v1_speech_asr_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeechAsrResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/speech/tts:
    post:
      tags:
      - speech
      summary: Speech Tts
      operationId: speech_tts_v1_speech_tts_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechTtsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/escalations:
    post:
      tags:
      - escalations
      summary: Create Escalation
      operationId: create_escalation_v1_escalations_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EscalationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscalationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - escalations
      summary: List Escalations
      operationId: list_escalations_v1_escalations_get
      parameters:
      - name: X-Demo-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Demo-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response List Escalations V1 Escalations Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/eval/latest:
    get:
      tags:
      - eval
      summary: Eval Latest
      operationId: eval_latest_v1_eval_latest_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalResults'
components:
  schemas:
    AbsActivity:
      type: string
      enum:
      - research
      - commercial_utilisation
      - ipr_application
      - transfer_results
      - export
      - cultivation_trade
      title: AbsActivity
    AbsChecklistItem:
      properties:
        id:
          type: string
          title: Id
        title:
          type: string
          title: Title
        authority:
          $ref: '#/components/schemas/Authority'
        form:
          anyOf:
          - type: string
          - type: 'null'
          title: Form
        required:
          type: boolean
          title: Required
        exempt:
          type: boolean
          title: Exempt
        exempt_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Exempt Reason
        timing:
          anyOf:
          - type: string
          - type: 'null'
          title: Timing
        detail:
          type: string
          title: Detail
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
      additionalProperties: false
      type: object
      required:
      - id
      - title
      - authority
      - required
      - exempt
      - detail
      title: AbsChecklistItem
    AbsPosture:
      properties:
        summary:
          type: string
          title: Summary
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
      additionalProperties: false
      type: object
      required:
      - summary
      title: AbsPosture
    AbsRequest:
      properties:
        applicant_type:
          $ref: '#/components/schemas/ApplicantType'
        activity:
          items:
            $ref: '#/components/schemas/AbsActivity'
          type: array
          title: Activity
        resources:
          items:
            $ref: '#/components/schemas/AbsResource'
          type: array
          title: Resources
        ipr_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Ipr Type
        as_of:
          anyOf:
          - type: string
          - type: 'null'
          title: As Of
        language:
          $ref: '#/components/schemas/Language'
          default: auto
      additionalProperties: false
      type: object
      required:
      - applicant_type
      - activity
      title: AbsRequest
    AbsResource:
      properties:
        species:
          type: string
          title: Species
        is_codified_tk:
          type: boolean
          title: Is Codified Tk
        is_cultivated:
          type: boolean
          title: Is Cultivated
        state:
          anyOf:
          - type: string
          - type: 'null'
          title: State
      additionalProperties: false
      type: object
      required:
      - species
      - is_codified_tk
      - is_cultivated
      title: AbsResource
    AbsResult:
      properties:
        type:
          type: string
          const: abs
          title: Type
          default: abs
        summary:
          type: string
          title: Summary
        checklist:
          items:
            $ref: '#/components/schemas/AbsChecklistItem'
          type: array
          title: Checklist
        decision_path:
          $ref: '#/components/schemas/DecisionPath'
        evidence:
          additionalProperties:
            $ref: '#/components/schemas/EvidenceSpan'
          type: object
          title: Evidence
        receipt_id:
          type: string
          title: Receipt Id
      additionalProperties: false
      type: object
      required:
      - summary
      - checklist
      - decision_path
      - evidence
      - receipt_id
      title: AbsResult
    ApplicantType:
      type: string
      enum:
      - indian_citizen
      - indian_company
      - foreign_entity
      - nri
      title: ApplicantType
    Authority:
      type: string
      enum:
      - NBA
      - SBB
      - BMC
      - none
      title: Authority
    Body_speech_asr_v1_speech_asr_post:
      properties:
        audio:
          type: string
          contentMediaType: application/octet-stream
          title: Audio
      type: object
      required:
      - audio
      title: Body_speech_asr_v1_speech_asr_post
    ClassifyCategory:
      type: string
      enum:
      - classical
      - proprietary
      - new_drug
      - phytopharmaceutical
      - aahar_nutraceutical
      - cosmetic
      title: ClassifyCategory
    ClassifyQuestion:
      properties:
        type:
          type: string
          const: question
          title: Type
          default: question
        question_id:
          type: string
          title: Question Id
        text:
          type: string
          title: Text
        why_asked:
          type: string
          title: Why Asked
        input:
          $ref: '#/components/schemas/QuestionInput'
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
        evidence:
          additionalProperties:
            $ref: '#/components/schemas/EvidenceSpan'
          type: object
          title: Evidence
        progress:
          $ref: '#/components/schemas/Progress'
      additionalProperties: false
      type: object
      required:
      - question_id
      - text
      - why_asked
      - input
      - progress
      title: ClassifyQuestion
    ClassifyRequest:
      properties:
        answers:
          additionalProperties:
            type: string
          type: object
          title: Answers
        jurisdiction:
          $ref: '#/components/schemas/Jurisdiction'
          default: BOTH
        as_of:
          anyOf:
          - type: string
          - type: 'null'
          title: As Of
        language:
          $ref: '#/components/schemas/Language'
          default: auto
      additionalProperties: false
      type: object
      title: ClassifyRequest
    ClassifyResult:
      properties:
        type:
          type: string
          const: result
          title: Type
          default: result
        category:
          $ref: '#/components/schemas/ClassifyCategory'
        category_label:
          type: string
          title: Category Label
        requirements:
          items:
            $ref: '#/components/schemas/Requirement'
          type: array
          title: Requirements
        ip_posture:
          $ref: '#/components/schemas/IpPosture'
        abs_posture:
          $ref: '#/components/schemas/AbsPosture'
        decision_path:
          $ref: '#/components/schemas/DecisionPath'
        evidence:
          additionalProperties:
            $ref: '#/components/schemas/EvidenceSpan'
          type: object
          title: Evidence
        receipt_id:
          type: string
          title: Receipt Id
      additionalProperties: false
      type: object
      required:
      - category
      - category_label
      - requirements
      - ip_posture
      - abs_posture
      - decision_path
      - evidence
      - receipt_id
      title: ClassifyResult
    CorpusVersionInfo:
      properties:
        label:
          type: string
          title: Label
        status:
          $ref: '#/components/schemas/CorpusVersionStatus'
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - label
      - status
      - created_at
      title: CorpusVersionInfo
    CorpusVersionStatus:
      type: string
      enum:
      - staged
      - live
      - retired
      title: CorpusVersionStatus
    DecisionEdge:
      properties:
        from:
          type: string
          title: From
        to:
          type: string
          title: To
        label:
          type: string
          title: Label
      additionalProperties: false
      type: object
      required:
      - from
      - to
      - label
      title: DecisionEdge
    DecisionNode:
      properties:
        id:
          type: string
          title: Id
        kind:
          type: string
          enum:
          - question
          - outcome
          title: Kind
        label:
          type: string
          title: Label
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
        evidence_ids:
          items:
            type: string
          type: array
          title: Evidence Ids
        taken:
          type: boolean
          title: Taken
          default: true
      additionalProperties: false
      type: object
      required:
      - id
      - kind
      - label
      title: DecisionNode
    DecisionPath:
      properties:
        nodes:
          items:
            $ref: '#/components/schemas/DecisionNode'
          type: array
          title: Nodes
        edges:
          items:
            $ref: '#/components/schemas/DecisionEdge'
          type: array
          title: Edges
        outcome_id:
          type: string
          title: Outcome Id
      additionalProperties: false
      type: object
      required:
      - nodes
      - edges
      - outcome_id
      title: DecisionPath
    DocType:
      type: string
      enum:
      - statute
      - rule
      - regulation
      - treaty
      - notification
      - case
      - guideline
      - manual
      title: DocType
    DocumentSummary:
      properties:
        id:
          type: string
          title: Id
        short_key:
          type: string
          title: Short Key
        title:
          type: string
          title: Title
        doc_type:
          $ref: '#/components/schemas/DocType'
        jurisdiction:
          $ref: '#/components/schemas/Jurisdiction'
        issuer:
          anyOf:
          - type: string
          - type: 'null'
          title: Issuer
        source_url:
          type: string
          title: Source Url
        language:
          type: string
          title: Language
        in_force_from:
          type: string
          format: date
          title: In Force From
        in_force_to:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: In Force To
      additionalProperties: false
      type: object
      required:
      - id
      - short_key
      - title
      - doc_type
      - jurisdiction
      - source_url
      - language
      - in_force_from
      title: DocumentSummary
    DossierFormat:
      type: string
      enum:
      - pdf
      - docx
      - md
      title: DossierFormat
    DossierRequest:
      properties:
        items:
          items:
            type: string
          type: array
          title: Items
        format:
          $ref: '#/components/schemas/DossierFormat'
          default: pdf
        language:
          $ref: '#/components/schemas/Language'
          default: auto
      additionalProperties: false
      type: object
      required:
      - items
      title: DossierRequest
    EscalationRequest:
      properties:
        request_id:
          type: string
          title: Request Id
        contact:
          anyOf:
          - type: string
          - type: 'null'
          title: Contact
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      required:
      - request_id
      title: EscalationRequest
    EscalationResponse:
      properties:
        ticket_id:
          type: string
          title: Ticket Id
        status:
          type: string
          title: Status
      additionalProperties: false
      type: object
      required:
      - ticket_id
      - status
      title: EscalationResponse
    EvalCondition:
      properties:
        name:
          type: string
          title: Name
        citation_precision:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Citation Precision
        citation_recall:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Citation Recall
        faithfulness:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Faithfulness
        abstention_accuracy:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Abstention Accuracy
        jurisdiction_leaks:
          type: integer
          minimum: 0.0
          title: Jurisdiction Leaks
      additionalProperties: false
      type: object
      required:
      - name
      - citation_precision
      - citation_recall
      - abstention_accuracy
      - jurisdiction_leaks
      title: EvalCondition
    EvalResults:
      properties:
        run_id:
          type: string
          title: Run Id
        corpus_version:
          type: string
          title: Corpus Version
        n_questions:
          type: integer
          title: N Questions
        conditions:
          items:
            $ref: '#/components/schemas/EvalCondition'
          type: array
          title: Conditions
        risk_coverage:
          items:
            $ref: '#/components/schemas/RiskCoveragePoint'
          type: array
          title: Risk Coverage
        generated_at:
          type: string
          format: date-time
          title: Generated At
      additionalProperties: false
      type: object
      required:
      - run_id
      - corpus_version
      - n_questions
      - conditions
      - generated_at
      title: EvalResults
    EvidenceSpan:
      properties:
        id:
          type: string
          title: Id
        doc_id:
          type: string
          title: Doc Id
        doc_title:
          type: string
          title: Doc Title
        doc_type:
          $ref: '#/components/schemas/DocType'
        jurisdiction:
          type: string
          enum:
          - IN
          - INTL
          title: Jurisdiction
        citation_label:
          type: string
          title: Citation Label
        section_key:
          type: string
          title: Section Key
        section_path:
          items:
            type: string
          type: array
          title: Section Path
        page:
          type: integer
          title: Page
        page_end:
          type: integer
          title: Page End
        char_start:
          type: integer
          title: Char Start
        char_end:
          type: integer
          title: Char End
        text:
          type: string
          title: Text
        sha256:
          type: string
          title: Sha256
        effective_from:
          type: string
          format: date
          title: Effective From
        effective_to:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effective To
        corpus_version:
          type: string
          title: Corpus Version
        source_url:
          type: string
          title: Source Url
        pdf_url:
          type: string
          title: Pdf Url
        highlights:
          items:
            $ref: '#/components/schemas/Highlight'
          type: array
          title: Highlights
      additionalProperties: false
      type: object
      required:
      - id
      - doc_id
      - doc_title
      - doc_type
      - jurisdiction
      - citation_label
      - section_key
      - section_path
      - page
      - page_end
      - char_start
