name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend
        run: pip install -e ".[dev,hosted]"

      - name: Lint (ruff)
        run: ruff check app

      - name: Typecheck (mypy)
        run: mypy app

      - name: Test (pytest — unit, integration, invariants, contract)
        env:
          MOCK_MODE: "1"
        run: pytest

      - name: Contract diff check (invariant I7)
        run: |
          python -c "
          import yaml
          from app.main import app
          yaml.safe_dump(app.openapi(), open('../contracts/openapi.yaml', 'w'), sort_keys=False)
          "
          cd ..
          git diff --exit-code contracts/openapi.yaml || {
            echo "::error::contracts/openapi.yaml is stale — run 'make contracts' and commit the result.";
            exit 1;
          }
