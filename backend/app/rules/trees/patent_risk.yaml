# Patent risk under Patents Act 1970 s.3(p)/(e)/(d) (§6.8). Every `cite` resolves against
# the real ingested text (backend/corpus — patents_act_1970). Drafted from the corpus text
# directly; not reviewed by counsel — treat every reason here as `status: draft` until it is
# (CLAUDE.md: "don't invent legal content... mark status: draft").
id: patent_risk
version: 0.1
status: draft
outputs:
  gauge_from: score
  thresholds: { low: 0.34, high: 0.67 }
rules:
  - id: p_classical_source_match
    section: "3(p)"
    when:
      all:
        - { field: classical_sources_cited, op: nonempty }
    weight: 0.5
    reason: "A classical source was declared. Review the cited exclusion against the actual disclosure and claimed invention. This is an unreviewed rule indicator."
    cite: ["patents_act_1970#s3(p)"]

  - id: e_admixture_no_synergy
    section: "3(e)"
    when:
      all:
        - { field: ingredients, op: len_gte, value: 2 }
        - { field: claims_novel_effect, op: eq, value: false }
    weight: 0.4
    reason: "Multiple ingredients and no claimed novel effect were declared. This does not establish mere admixture; review the cited provision and evidence of the technical effect."
    cite: ["patents_act_1970#s3(e)"]

  - id: d_new_form_no_efficacy
    section: "3(d)"
    when:
      all:
        - { field: is_derivative_of_known_substance, op: eq, value: true }
    weight: 0.4
    reason: "A derivative of a known substance was declared. The existence of clinical data alone does not establish enhanced efficacy or determine applicability of the cited provision."
    cite: ["patents_act_1970#s3(d)"]

  - id: p_no_novel_effect_and_classical
    section: "3(p)"
    when:
      all:
        - { field: classical_sources_cited, op: nonempty }
        - { field: claims_novel_effect, op: eq, value: false }
    weight: 0.2
    reason: "No novel effect was declared alongside the classical source. Compare the claimed invention with that source and the cited provision."
    cite: ["patents_act_1970#s3(p)"]
