# Locked legal/domain terms (§6.3, §8): masked with a placeholder before translation and
# restored after, so a translation model never rephrases a term of art. `translations` are a
# first-pass by the assistant, not by a fluent native speaker — §8 explicitly calls for a
# fluent-speaker review before these ship; treat this file as a draft seed, not a verified
# glossary. Extend as more corpus documents are ingested and more terms need locking.
