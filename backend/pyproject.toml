[project]
name = "pramana-backend"
version = "0.1.0"
description = "PRAMANA backend — proof-carrying Ayurvedic IP/ABS/regulatory assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pyyaml>=6.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "transformers>=4.45,<5",
    "sentencepiece>=0.2",
    "torch>=2.5",
    "langdetect>=1.0.9",
    "reportlab>=4.2",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
    "types-reportlab",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Query()/File() default-arg pattern is idiomatic, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "app.schemas.*"
strict = true

[[tool.mypy.overrides]]
module = "app.core.*"
strict = true

# No type stubs published for these; the packages themselves are typed loosely enough that
# stub-hunting isn't worth it for a prototype (langdetect has no py.typed at all, pymupdf's
# stubs are already handled inline via targeted `type: ignore`s where they bite).
[[tool.mypy.overrides]]
module = ["langdetect", "langdetect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
